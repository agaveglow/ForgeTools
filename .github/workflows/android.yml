name: Build Android APK
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # Install scripts from dependencies are not run.
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: bun scripts/build.ts
      - run: npx cap add android
      - name: Harden Android manifest (no cloud auto-backup, no plain-http traffic, not debuggable)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $f
          sed -i 's/<application/<application android:usesCleartextTraffic="false" android:debuggable="false"/' $f
          grep -n "allowBackup\|usesCleartextTraffic\|debuggable" $f
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleRelease
        working-directory: android
      - name: Sign the APK
        id: sign
        run: |
          set -e
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ft.jks"
            echo "key=permanent" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ft.jks" -storetype PKCS12 -alias forgetools -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=ForgeTools one-off" -storepass oneoffkey1 -keypass oneoffkey1
            KS_PASS=oneoffkey1
            echo "key=oneoff" >> "$GITHUB_OUTPUT"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cd android/app/build/outputs/apk/release
          "$BT/zipalign" -p 4 app-release-unsigned.apk aligned.apk
          KS_PASS="$KS_PASS" "$BT/apksigner" sign --ks "$RUNNER_TEMP/ft.jks" --ks-pass env:KS_PASS --out ForgeTools.apk aligned.apk
          "$BT/apksigner" verify --print-certs ForgeTools.apk | head -3
          echo "sha=$(sha256sum ForgeTools.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/ft.jks"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ForgeTools APK ${{ github.run_number }}
          body: |
            Release build. SHA-256: `${{ steps.sign.outputs.sha }}`
            Signing key: ${{ steps.sign.outputs.key == 'permanent' && 'your permanent key, so this installs over the previous build and keeps your data.' || 'a one-off key. Android will not install this over an earlier build, so the old app must be uninstalled first, which deletes its data. Export an encrypted backup first, and see the README to set a permanent key.' }}
            Open the file on your phone and allow installs from this source.
          files: android/app/build/outputs/apk/release/ForgeTools.apk
