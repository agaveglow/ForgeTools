name: Build Android APK
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # Install scripts from dependencies are not run.
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: bun scripts/build.ts
      - run: npx cap add android
      - name: Harden Android manifest (no cloud auto-backup, no plain-http traffic)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $f
          sed -i 's/<application/<application android:usesCleartextTraffic="false"/' $f
          grep -n "allowBackup\|usesCleartextTraffic" $f
      - name: Add the reminders permission and receiver
        run: |
          f=android/app/src/main/AndroidManifest.xml
          python3 - "$f" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />', s, count=1)
          s = s.replace('</application>', '    <receiver android:name=".ReminderReceiver" android:exported="false" />\n  </application>')
          open(p, 'w').write(s)
          PYEOF
          grep -n "POST_NOTIFICATIONS\|ReminderReceiver" $f
      - name: Add the folder-backup and reminders plugins
        run: |
          d=android/app/src/main/java/app/forgetools/mobile
          mkdir -p "$d"
          cp native/android/FolderSyncPlugin.java native/android/MainActivity.java native/android/RemindersPlugin.java native/android/ReminderReceiver.java "$d/"
      - run: npx cap sync android
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            msg=$(grep -E "error:|What went wrong|FAILED|Execution failed|\.java:[0-9]+" -A2 "$RUNNER_TEMP/gradle.log" | head -40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Gradle build failed::$msg"
            exit 1
          }
      - name: Sign the APK
        id: sign
        run: |
          set -e
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ft.jks"
            echo "key=permanent" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ft.jks" -storetype PKCS12 -alias forgetools -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=ForgeTools one-off" -storepass oneoffkey1 -keypass oneoffkey1
            KS_PASS=oneoffkey1
            echo "key=oneoff" >> "$GITHUB_OUTPUT"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cd android/app/build/outputs/apk/release
          "$BT/zipalign" -p 4 app-release-unsigned.apk aligned.apk
          KS_PASS="$KS_PASS" "$BT/apksigner" sign --ks "$RUNNER_TEMP/ft.jks" --ks-pass env:KS_PASS --out ForgeTools.apk aligned.apk
          "$BT/apksigner" verify --print-certs ForgeTools.apk | head -3
          echo "sha=$(sha256sum ForgeTools.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/ft.jks"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: apk-${{ github.run_number }}
          name: ForgeTools APK ${{ github.run_number }}
          body: |
            Release build. SHA-256: `${{ steps.sign.outputs.sha }}`
            Signing key: ${{ steps.sign.outputs.key == 'permanent' && 'your permanent key, so this installs over the previous build and keeps your data.' || 'a one-off key. Android will not install this over an earlier build, so the old app must be uninstalled first, which deletes its data. Export an encrypted backup first, and see the README to set a permanent key.' }}
            Open the file on your phone and allow installs from this source.
          files: android/app/build/outputs/apk/release/ForgeTools.apk
